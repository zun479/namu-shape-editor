<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나무위키 도형 편집기</title>
<style>
  :root{
    --bg-app: #14151A;
    --bg-panel: #1C1E24;
    --bg-panel-2: #23252D;
    --border: #33353E;
    --text-hi: #F2F1ED;
    --text-lo: #9A9CA6;
    --accent: #4ADE9A;
    --accent-dim: #234034;
    --canvas-bg: #E9E6DF;
    --danger: #E8654F;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg-app);
    color: var(--text-hi);
    height:100vh;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 56px 1fr;
    height:100vh;
  }
  header{
    grid-column: 1 / -1;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  header h1{
    font-size: 15px;
    font-weight: 600;
    margin:0;
    letter-spacing: -0.01em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1 .dot{ width:8px;height:8px;border-radius:50%;background:var(--accent); }
  .canvas-size-controls{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color: var(--text-lo);
  }
  .canvas-size-controls input[type=number]{
    width:64px;
  }
  .btn{
    background: var(--bg-panel-2);
    color: var(--text-hi);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    cursor:pointer;
    font-weight:500;
    transition: border-color .15s, transform .05s;
  }
  .btn:hover{ border-color: #4b4e5a; }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--accent);
    color: #0B1410;
    border-color: var(--accent);
    font-weight:700;
  }
  .btn-primary:hover{ filter: brightness(1.06); }
  .sidebar{
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 16px 14px;
    display:flex;
    flex-direction:column;
    gap: 18px;
    overflow-y:auto;
  }
  .section-label{
    font-size:11px;
    color: var(--text-lo);
    font-weight:600;
    margin-bottom:8px;
  }
  .shape-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .shape-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    color: var(--text-hi);
    cursor:pointer;
    font-size:13px;
    text-align:left;
  }
  .shape-btn:hover{ border-color: var(--accent); }
  .shape-icon{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .layer-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-height: 260px;
    overflow-y:auto;
  }
  .layer-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 9px;
    border-radius:7px;
    font-size:12px;
    cursor:pointer;
    color: var(--text-lo);
    border: 1px solid transparent;
  }
  .layer-item:hover{ background: var(--bg-panel-2); }
  .layer-item.selected{
    background: var(--accent-dim);
    color: var(--text-hi);
    border-color: var(--accent);
  }
  /* ===== 모바일 모드 레이아웃 ===== */
  body.device-mobile .app{
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr auto;
    height: 100dvh;
  }
  body.device-mobile header{
    flex-wrap: wrap;
    height: auto;
    padding: 10px 12px;
    gap: 8px;
    row-gap: 6px;
  }
  body.device-mobile header h1{ width:100%; }
  body.device-mobile .canvas-size-controls{
    flex-wrap: wrap;
    font-size: 11.5px;
    row-gap: 6px;
  }
  body.device-mobile #exportBtn{
    width: 100%;
    order: 3;
  }
  body.device-mobile .sidebar{
    flex-direction: row;
    align-items: stretch;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    gap: 14px;
  }
  body.device-mobile .sidebar > div{ flex-shrink:0; }
  body.device-mobile .shape-buttons{
    flex-direction: row;
  }
  body.device-mobile .shape-btn{
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    padding: 8px 12px;
    white-space: nowrap;
  }
  body.device-mobile .layer-list{
    flex-direction: row;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
  }
  body.device-mobile .layer-item{
    white-space: nowrap;
  }
  body.device-mobile .props{
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 34vh;
  }
  body.device-mobile .canvas-wrap{
    min-height: 0;
  }

  .canvas-wrap{
    position:relative;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(45deg, #1a1b20 25%, transparent 25%),
      linear-gradient(-45deg, #1a1b20 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1b20 75%),
      linear-gradient(-45deg, transparent 75%, #1a1b20 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #101116;
  }
  #canvas{
    position:relative;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  .shape{
    position:absolute;
    cursor:move;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1.3;
    word-break: break-word;
  }
  .shape.selected{
    outline: 2px solid var(--accent);
    outline-offset:1px;
  }
  .resize-handle{
    position:absolute;
    width:14px;height:14px;
    background: var(--accent);
    border: 2px solid #0B1410;
    border-radius:4px;
    right:-7px;
    bottom:-7px;
    cursor: nwse-resize;
    touch-action:none;
  }
  .rotate-handle{
    position:absolute;
    width:12px;height:12px;
    background: #fff;
    border: 2px solid var(--accent);
    border-radius:50%;
    left:50%;
    top:-24px;
    transform: translateX(-50%);
    cursor: grab;
    touch-action:none;
  }
  /* 모바일 모드: 손가락으로 잡기 쉽게 핸들을 크게 */
  body.device-mobile .resize-handle{
    width:30px; height:30px;
    right:-15px; bottom:-15px;
    border-radius:8px;
  }
  body.device-mobile .rotate-handle{
    width:26px; height:26px;
    top:-34px;
  }
  body.device-mobile .rotate-stem{
    top:-18px; height:18px;
  }
  .rotate-stem{
    position:absolute;
    left:50%;
    top:-14px;
    width:1px;
    height:14px;
    background: var(--accent);
    transform: translateX(-50%);
  }
  .props{
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    padding: 16px 14px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty-hint{
    color: var(--text-lo);
    font-size:13px;
    line-height:1.6;
    margin-top: 10px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:11px;
    color: var(--text-lo);
    font-weight:600;
  }
  .field-row{
    display:flex;
    gap:8px;
  }
  .field-row .field{ flex:1; }
  input[type=text], input[type=number], textarea, select{
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    color: var(--text-hi);
    border-radius:7px;
    padding: 7px 9px;
    font-size:13px;
    width:100%;
    font-family: inherit;
  }
  input[type=color]{
    width:100%;
    height:32px;
    padding:2px;
    background: var(--bg-panel-2);
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
  }
  input[type=range]{ width:100%; accent-color: var(--accent); }
  textarea{ resize: vertical; min-height:50px; }
  .row-actions{
    display:flex;
    gap:8px;
  }
  .row-actions .btn{ flex:1; }
  .danger-btn{
    background: transparent;
    border:1px solid var(--danger);
    color: var(--danger);
  }
  .danger-btn:hover{ background: rgba(232,101,79,0.1); }

  /* Export modal */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(10,10,12,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius:14px;
    width: min(680px, 92vw);
    max-height: 80vh;
    display:flex;
    flex-direction:column;
    padding: 20px;
    gap:12px;
  }
  .modal h2{ margin:0; font-size:16px; }
  .modal p{ margin:0; color: var(--text-lo); font-size:12.5px; line-height:1.6; }
  .modal textarea{
    flex:1;
    min-height: 260px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size:12px;
    white-space: pre;
  }
  .modal-footer{
    display:flex;
    justify-content: flex-end;
    gap:8px;
  }
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color:#0B1410;
    padding: 10px 18px;
    border-radius: 8px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition: all .25s ease;
    pointer-events:none;
    z-index: 200;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="modal-overlay open" id="deviceModal">
  <div class="modal" style="align-items:center; text-align:center;">
    <h2>어떤 기기에서 사용하시나요?</h2>
    <p>선택에 따라 화면 배치와 터치 조작 방식이 최적화돼요. 나중에 우측 상단 버튼으로 언제든 바꿀 수 있어요.</p>
    <div style="display:flex; gap:12px; justify-content:center; margin-top:6px;">
      <button class="btn btn-primary" id="choosePc" style="flex:1; padding:20px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; font-size:14px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="1.5" stroke="#0B1410" stroke-width="1.6"/><path d="M8 20h8M12 17v3" stroke="#0B1410" stroke-width="1.6" stroke-linecap="round"/></svg>
        PC / 데스크톱
      </button>
      <button class="btn" id="chooseMobile" style="flex:1; padding:20px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; font-size:14px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="6" y="2" width="12" height="20" rx="2" stroke="#F2F1ED" stroke-width="1.6"/><circle cx="12" cy="18.5" r="0.9" fill="#F2F1ED"/></svg>
        모바일 / 태블릿
      </button>
    </div>
  </div>
</div>

<div class="app">
  <header>
    <h1><span class="dot"></span>나무위키 도형 편집기</h1>
    <div class="canvas-size-controls">
      <span>테이블 크기</span>
      <input type="number" id="canvasW" value="500" min="50" max="2000"> ×
      <input type="number" id="canvasH" value="300" min="50" max="2000"> px
      <span style="margin-left:6px;">배경색</span>
      <input type="color" id="canvasBg" value="#ffffff" style="width:36px;height:28px;padding:2px;">
    </div>
    <button class="btn" id="deviceSwitchBtn" title="기기 모드 변경">📱/🖥️</button>
    <button class="btn btn-primary" id="exportBtn">내보내기 (문법 생성)</button>
  </header>

  <div class="sidebar">
    <div>
      <div class="section-label">도형 추가</div>
      <div class="shape-buttons">
        <button class="shape-btn" data-add="rect">
          <span class="shape-icon"><svg width="18" height="18"><rect x="1" y="3" width="16" height="12" rx="2" fill="#4ADE9A"/></svg></span>
          사각형
        </button>
        <button class="shape-btn" data-add="ellipse">
          <span class="shape-icon"><svg width="18" height="18"><ellipse cx="9" cy="9" rx="8" ry="6.5" fill="#4ADE9A"/></svg></span>
          원 / 타원
        </button>
        <button class="shape-btn" data-add="text">
          <span class="shape-icon"><svg width="18" height="18"><text x="2" y="14" font-size="14" font-weight="700" fill="#4ADE9A">T</text></svg></span>
          텍스트
        </button>
      </div>
    </div>
    <div>
      <div class="section-label">레이어 (위 = 앞쪽)</div>
      <div class="layer-list" id="layerList"></div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div id="canvas"></div>
  </div>

  <div class="props" id="propsPanel">
    <div class="empty-hint">도형을 클릭하면<br>여기서 위치·크기·색을 조정할 수 있어요.</div>
  </div>
</div>

<div class="modal-overlay" id="exportModal">
  <div class="modal">
    <h2>나무위키 문법</h2>
    <p id="exportNote">아래 코드를 전체 복사해서 나무위키 편집창의 테이블 셀 안에 붙여넣으면 지금 배치한 도형이 그대로 나와요.</p>
    <textarea id="exportCode" readonly></textarea>
    <div class="modal-footer">
      <button class="btn" id="closeModalBtn">닫기</button>
      <button class="btn btn-primary" id="copyBtn">복사하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">복사되었습니다</div>

<script>
(function(){
  // --- 기기 선택 ---
  const deviceModal = document.getElementById('deviceModal');

  function setDevice(mode){
    document.body.classList.remove('device-pc', 'device-mobile');
    document.body.classList.add('device-' + mode);
    deviceModal.classList.remove('open');
    try{ localStorage.setItem('namu-editor-device', mode); }catch(e){}
    if(typeof render === 'function') render();
  }

  document.getElementById('choosePc').addEventListener('click', () => setDevice('pc'));
  document.getElementById('chooseMobile').addEventListener('click', () => setDevice('mobile'));
  document.getElementById('deviceSwitchBtn').addEventListener('click', () => {
    deviceModal.classList.add('open');
  });

  // 화면 폭으로 기본 추천값을 미리 하이라이트
  const likelyMobile = window.matchMedia('(pointer: coarse), (max-width: 820px)').matches;
  if(likelyMobile){
    document.getElementById('chooseMobile').classList.add('btn-primary');
    document.getElementById('choosePc').classList.remove('btn-primary');
  }

  let shapes = [];
  let idCounter = 1;
  let selectedId = null;
  let canvasSize = { w: 500, h: 300, bg: '#ffffff' };

  const canvasEl = document.getElementById('canvas');
  const layerListEl = document.getElementById('layerList');
  const propsPanel = document.getElementById('propsPanel');
  const toastEl = document.getElementById('toast');

  function uid(){ return 'shape_' + (idCounter++); }

  function defaultShape(type){
    const base = {
      id: uid(),
      type,
      x: Math.round(canvasSize.w/2 - 60),
      y: Math.round(canvasSize.h/2 - 40),
      w: 120,
      h: 80,
      rotation: 0,
      fill: '#4ADE9A',
      radius: type === 'ellipse' ? 999 : 0,
      opacity: 100,
      z: shapes.length + 1
    };
    if(type === 'text'){
      base.w = 160;
      base.h = 40;
      base.text = '텍스트 입력';
      base.fontSize = 20;
      base.color = '#111111';
      base.fontWeight = 700;
      base.fill = 'transparent';
      base.align = 'center';
    }
    return base;
  }

  function addShape(type){
    const s = defaultShape(type);
    shapes.push(s);
    selectedId = s.id;
    render();
  }

  function getShape(id){ return shapes.find(s => s.id === id); }

  function applyCanvasSize(){
    canvasEl.style.width = canvasSize.w + 'px';
    canvasEl.style.height = canvasSize.h + 'px';
    canvasEl.style.background = canvasSize.bg;
  }

  function render(){
    applyCanvasSize();
    canvasEl.innerHTML = '';
    const sorted = [...shapes].sort((a,b) => a.z - b.z);
    sorted.forEach(s => {
      const el = document.createElement('div');
      el.className = 'shape' + (s.id === selectedId ? ' selected' : '');
      el.style.left = s.x + 'px';
      el.style.top = s.y + 'px';
      el.style.width = s.w + 'px';
      el.style.height = s.h + 'px';
      el.style.zIndex = s.z;
      el.style.transform = `rotate(${s.rotation}deg)`;
      el.style.opacity = (s.opacity ?? 100) / 100;
      el.dataset.id = s.id;

      if(s.type === 'rect' || s.type === 'ellipse'){
        el.style.background = s.fill;
        el.style.borderRadius = s.type === 'ellipse' ? '50%' : (s.radius + 'px');
      } else if(s.type === 'text'){
        el.style.background = s.fill === 'transparent' ? 'transparent' : s.fill;
        el.style.color = s.color;
        el.style.fontSize = s.fontSize + 'px';
        el.style.fontWeight = s.fontWeight;
        el.style.justifyContent = s.align === 'left' ? 'flex-start' : s.align === 'right' ? 'flex-end' : 'center';
        el.style.textAlign = s.align;
        el.textContent = s.text;
      }

      if(s.id === selectedId){
        const stem = document.createElement('div');
        stem.className = 'rotate-stem';
        el.appendChild(stem);
        const rotHandle = document.createElement('div');
        rotHandle.className = 'rotate-handle';
        rotHandle.addEventListener('pointerdown', (e) => startRotate(e, s.id));
        el.appendChild(rotHandle);

        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        handle.addEventListener('pointerdown', (e) => startResize(e, s.id));
        el.appendChild(handle);
      }

      el.addEventListener('pointerdown', (e) => {
        if(e.target.classList.contains('resize-handle') || e.target.classList.contains('rotate-handle')) return;
        selectedId = s.id;
        startDrag(e, s.id);
        render();
      });

      canvasEl.appendChild(el);
    });
    renderLayerList();
    renderProps();
  }

  function renderLayerList(){
    layerListEl.innerHTML = '';
    const sorted = [...shapes].sort((a,b) => b.z - a.z);
    if(sorted.length === 0){
      layerListEl.innerHTML = '<div style="color:var(--text-lo);font-size:12px;">아직 도형이 없어요</div>';
      return;
    }
    sorted.forEach(s => {
      const item = document.createElement('div');
      item.className = 'layer-item' + (s.id === selectedId ? ' selected' : '');
      const label = s.type === 'rect' ? '사각형' : s.type === 'ellipse' ? '원/타원' : `텍스트: ${s.text.slice(0,8)}`;
      item.textContent = label;
      item.addEventListener('click', () => { selectedId = s.id; render(); });
      layerListEl.appendChild(item);
    });
  }

  function field(labelText, inputEl){
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('label');
    label.textContent = labelText;
    wrap.appendChild(label);
    wrap.appendChild(inputEl);
    return wrap;
  }

  function numberInput(value, onChange, opts={}){
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.value = value;
    if(opts.min !== undefined) inp.min = opts.min;
    if(opts.max !== undefined) inp.max = opts.max;
    inp.addEventListener('input', () => onChange(Number(inp.value)));
    return inp;
  }

  function colorInput(value, onChange){
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = value && value.startsWith('#') ? value : '#ffffff';
    inp.addEventListener('input', () => onChange(inp.value));
    return inp;
  }

  function renderProps(){
    propsPanel.innerHTML = '';
    const s = getShape(selectedId);
    if(!s){
      propsPanel.innerHTML = '<div class="empty-hint">도형을 클릭하면<br>여기서 위치·크기·색을 조정할 수 있어요.</div>';
      return;
    }

    const title = document.createElement('div');
    title.className = 'section-label';
    title.textContent = (s.type === 'rect' ? '사각형' : s.type === 'ellipse' ? '원/타원' : '텍스트') + ' 속성';
    propsPanel.appendChild(title);

    const rowPos = document.createElement('div');
    rowPos.className = 'field-row';
    rowPos.appendChild(field('X', numberInput(s.x, v => { s.x = v; render(); })));
    rowPos.appendChild(field('Y', numberInput(s.y, v => { s.y = v; render(); })));
    propsPanel.appendChild(rowPos);

    const rowSize = document.createElement('div');
    rowSize.className = 'field-row';
    rowSize.appendChild(field('너비', numberInput(s.w, v => { s.w = Math.max(4,v); render(); }, {min:4})));
    rowSize.appendChild(field('높이', numberInput(s.h, v => { s.h = Math.max(4,v); render(); }, {min:4})));
    propsPanel.appendChild(rowSize);

    const rotWrap = document.createElement('div');
    rotWrap.className = 'field';
    const rotLabel = document.createElement('label');
    rotLabel.textContent = `회전 (${s.rotation}°)`;
    const rotInput = document.createElement('input');
    rotInput.type = 'range';
    rotInput.min = -180; rotInput.max = 180;
    rotInput.value = s.rotation;
    rotInput.addEventListener('input', () => { s.rotation = Number(rotInput.value); rotLabel.textContent = `회전 (${s.rotation}°)`; render(); });
    rotWrap.appendChild(rotLabel);
    rotWrap.appendChild(rotInput);
    propsPanel.appendChild(rotWrap);

    const opWrap = document.createElement('div');
    opWrap.className = 'field';
    const opLabel = document.createElement('label');
    opLabel.textContent = `불투명도 (${s.opacity}%)`;
    const opInput = document.createElement('input');
    opInput.type = 'range';
    opInput.min = 0; opInput.max = 100;
    opInput.value = s.opacity;
    opInput.addEventListener('input', () => { s.opacity = Number(opInput.value); opLabel.textContent = `불투명도 (${s.opacity}%)`; render(); });
    opWrap.appendChild(opLabel);
    opWrap.appendChild(opInput);
    propsPanel.appendChild(opWrap);

    if(s.type === 'rect'){
      propsPanel.appendChild(field('채우기 색', colorInput(s.fill, v => { s.fill = v; render(); })));
      const rWrap = document.createElement('div');
      rWrap.className = 'field';
      const rLabel = document.createElement('label');
      rLabel.textContent = `모서리 둥글기 (${s.radius}px)`;
      const rInput = document.createElement('input');
      rInput.type = 'range';
      rInput.min = 0; rInput.max = 150;
      rInput.value = s.radius;
      rInput.addEventListener('input', () => { s.radius = Number(rInput.value); rLabel.textContent = `모서리 둥글기 (${s.radius}px)`; render(); });
      rWrap.appendChild(rLabel);
      rWrap.appendChild(rInput);
      propsPanel.appendChild(rWrap);
    } else if(s.type === 'ellipse'){
      propsPanel.appendChild(field('채우기 색', colorInput(s.fill, v => { s.fill = v; render(); })));
    } else if(s.type === 'text'){
      const ta = document.createElement('textarea');
      ta.value = s.text;
      ta.addEventListener('input', () => { s.text = ta.value; render(); });
      propsPanel.appendChild(field('내용', ta));

      const rowText = document.createElement('div');
      rowText.className = 'field-row';
      rowText.appendChild(field('글자 크기', numberInput(s.fontSize, v => { s.fontSize = v; render(); }, {min:6})));
      const alignSel = document.createElement('select');
      ['left','center','right'].forEach(a => {
        const opt = document.createElement('option');
        opt.value = a; opt.textContent = a === 'left' ? '왼쪽' : a === 'center' ? '가운데' : '오른쪽';
        if(a === s.align) opt.selected = true;
        alignSel.appendChild(opt);
      });
      alignSel.addEventListener('change', () => { s.align = alignSel.value; render(); });
      rowText.appendChild(field('정렬', alignSel));
      propsPanel.appendChild(rowText);

      propsPanel.appendChild(field('글자 색', colorInput(s.color, v => { s.color = v; render(); })));

      const bgWrap = document.createElement('div');
      bgWrap.className = 'field';
      const bgLabel = document.createElement('label');
      bgLabel.textContent = '배경 (텍스트 상자)';
      const bgToggle = document.createElement('select');
      ['transparent','filled'].forEach(v => {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v === 'transparent' ? '투명' : '색 채우기';
        if((v === 'transparent') === (s.fill === 'transparent')) opt.selected = true;
        bgToggle.appendChild(opt);
      });
      bgToggle.addEventListener('change', () => {
        s.fill = bgToggle.value === 'transparent' ? 'transparent' : '#FFF3B0';
        render();
      });
      bgWrap.appendChild(bgLabel);
      bgWrap.appendChild(bgToggle);
      propsPanel.appendChild(bgWrap);

      if(s.fill !== 'transparent'){
        propsPanel.appendChild(field('배경 색', colorInput(s.fill, v => { s.fill = v; render(); })));
      }
    }

    const rowActions = document.createElement('div');
    rowActions.className = 'row-actions';
    const frontBtn = document.createElement('button');
    frontBtn.className = 'btn';
    frontBtn.textContent = '맨 앞으로';
    frontBtn.addEventListener('click', () => { bringToFront(s.id); });
    const backBtn = document.createElement('button');
    backBtn.className = 'btn';
    backBtn.textContent = '맨 뒤로';
    backBtn.addEventListener('click', () => { sendToBack(s.id); });
    rowActions.appendChild(frontBtn);
    rowActions.appendChild(backBtn);
    propsPanel.appendChild(rowActions);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn danger-btn';
    delBtn.textContent = '도형 삭제';
    delBtn.addEventListener('click', () => {
      shapes = shapes.filter(x => x.id !== s.id);
      selectedId = null;
      render();
    });
    propsPanel.appendChild(delBtn);
  }

  function bringToFront(id){
    const maxZ = Math.max(0, ...shapes.map(s => s.z));
    const s = getShape(id);
    s.z = maxZ + 1;
    render();
  }
  function sendToBack(id){
    const minZ = Math.min(0, ...shapes.map(s => s.z));
    const s = getShape(id);
    s.z = minZ - 1;
    render();
  }

  // --- Drag ---
  function startDrag(e, id){
    e.preventDefault();
    const s = getShape(id);
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    const origX = s.x, origY = s.y;
    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      s.x = Math.round(origX + dx);
      s.y = Math.round(origY + dy);
      render();
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // --- Resize ---
  function startResize(e, id){
    e.preventDefault();
    e.stopPropagation();
    const s = getShape(id);
    const pointerId = e.pointerId;
    const startX = e.clientX, startY = e.clientY;
    const origW = s.w, origH = s.h;
    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      s.w = Math.max(4, Math.round(origW + dx));
      s.h = Math.max(4, Math.round(origH + dy));
      render();
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // --- Rotate ---
  function startRotate(e, id){
    e.preventDefault();
    e.stopPropagation();
    const s = getShape(id);
    const pointerId = e.pointerId;
    const el = document.querySelector(`[data-id="${id}"]`);
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const angle = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
      s.rotation = Math.round(angle);
      render();
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // deselect when clicking empty canvas area
  canvasEl.addEventListener('pointerdown', (e) => {
    if(e.target === canvasEl){
      selectedId = null;
      render();
    }
  });

  // --- Toolbar ---
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addShape(btn.dataset.add));
  });

  document.getElementById('canvasW').addEventListener('input', (e) => {
    canvasSize.w = Math.max(50, Number(e.target.value) || 50);
    render();
  });
  document.getElementById('canvasH').addEventListener('input', (e) => {
    canvasSize.h = Math.max(50, Number(e.target.value) || 50);
    render();
  });
  document.getElementById('canvasBg').addEventListener('input', (e) => {
    canvasSize.bg = e.target.value;
    render();
  });

  // --- 회전 도형 -> 이미지 변환 (나무위키가 transform을 걸러내므로 회전은 이미지로 구워서 내보냄) ---
  function rotatedBBox(s){
    const rad = s.rotation * Math.PI / 180;
    const cos = Math.abs(Math.cos(rad));
    const sin = Math.abs(Math.sin(rad));
    const bbW = Math.max(1, Math.round(s.w * cos + s.h * sin));
    const bbH = Math.max(1, Math.round(s.w * sin + s.h * cos));
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    return {
      bbX: Math.round(cx - bbW / 2),
      bbY: Math.round(cy - bbH / 2),
      bbW, bbH
    };
  }

  // 회전된 도형의 윤곽선(다각형) 좌표를 계산 - transform 없이 clip-path만으로 회전을 표현하기 위함
  function shapeOutlinePoints(s){
    const w = s.w, h = s.h;
    if(s.type === 'ellipse'){
      const N = 40;
      const pts = [];
      for(let i = 0; i < N; i++){
        const t = (i / N) * Math.PI * 2;
        pts.push([(w / 2) * Math.cos(t), (h / 2) * Math.sin(t)]);
      }
      return pts;
    }
    // rect (모서리가 둥글면 근사 곡선으로)
    const r = Math.max(0, Math.min(s.radius || 0, w / 2, h / 2));
    if(r < 1){
      return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]];
    }
    const seg = 6;
    function arc(cx, cy, a0, a1){
      const arr = [];
      for(let i = 0; i <= seg; i++){
        const t = a0 + (a1 - a0) * (i / seg);
        arr.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
      }
      return arr;
    }
    return [
      ...arc(-w/2 + r, -h/2 + r, Math.PI, 1.5 * Math.PI),
      ...arc(w/2 - r, -h/2 + r, 1.5 * Math.PI, 2 * Math.PI),
      ...arc(w/2 - r, h/2 - r, 0, 0.5 * Math.PI),
      ...arc(-w/2 + r, h/2 - r, 0.5 * Math.PI, Math.PI)
    ];
  }

  function rotatedClipPath(s){
    const rad = s.rotation * Math.PI / 180;
    const cosA = Math.cos(rad), sinA = Math.sin(rad);
    const { bbX, bbY, bbW, bbH } = rotatedBBox(s);
    const pts = shapeOutlinePoints(s);
    const polygon = pts.map(([px, py]) => {
      const rx = px * cosA - py * sinA;
      const ry = px * sinA + py * cosA;
      return `${(bbW/2 + rx).toFixed(1)}px ${(bbH/2 + ry).toFixed(1)}px`;
    }).join(', ');
    return { bbX, bbY, bbW, bbH, polygon };
  }

  function drawRoundedRectPath(ctx, x, y, w, h, r){
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function shapeToCanvas(s, scale){
    scale = scale || 2;
    const { bbW, bbH } = rotatedBBox(s);
    const canvas = document.createElement('canvas');
    canvas.width = bbW * scale;
    canvas.height = bbH * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.translate(bbW / 2, bbH / 2);
    ctx.rotate(s.rotation * Math.PI / 180);
    ctx.globalAlpha = (s.opacity ?? 100) / 100;

    if(s.type === 'rect'){
      ctx.fillStyle = s.fill;
      drawRoundedRectPath(ctx, -s.w / 2, -s.h / 2, s.w, s.h, s.radius || 0);
      ctx.fill();
    } else if(s.type === 'ellipse'){
      ctx.fillStyle = s.fill;
      ctx.beginPath();
      ctx.ellipse(0, 0, s.w / 2, s.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if(s.type === 'text'){
      if(s.fill && s.fill !== 'transparent'){
        ctx.fillStyle = s.fill;
        ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      }
      ctx.fillStyle = s.color;
      ctx.font = `${s.fontWeight} ${s.fontSize}px "Pretendard", "Apple SD Gothic Neo", sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = s.align === 'left' ? 'left' : s.align === 'right' ? 'right' : 'center';
      const anchorX = s.align === 'left' ? -s.w / 2 + 4 : s.align === 'right' ? s.w / 2 - 4 : 0;
      const lines = s.text.split('\n');
      const lineHeight = s.fontSize * 1.25;
      const totalH = lineHeight * lines.length;
      const startY = -totalH / 2 + lineHeight / 2;
      lines.forEach((line, i) => ctx.fillText(line, anchorX, startY + i * lineHeight));
    }
    return canvas;
  }

  function canvasToBlob(canvas){
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // --- Export ---
  // 나무위키는 position: absolute를 필터링해서 무시하기 때문에(자식들이 문서 순서대로 세로로 쌓여버림),
  // 절대 위치 지정 대신 "박스 하나 + 여러 겹의 background-image"로 좌표를 표현한다.
  // - 회전 없는 사각형/타원은 CSS 그라디언트만으로 만든다 (position 불필요, 실사용 예시로 확인된 방식)
  // - 회전/둥근모서리/텍스트처럼 그라디언트로 못 만드는 도형은 캔버스로 구워서
  //   base64 PNG를 그대로 background-image: url(data:...)에 박아 넣는다 (별도 업로드 불필요)
  function hexToRgba(hex, opacityPercent){
    if(!hex || hex === 'transparent') return 'rgba(0,0,0,0)';
    let h = hex.replace('#', '');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.substring(0, 2), 16) || 0;
    const g = parseInt(h.substring(2, 4), 16) || 0;
    const b = parseInt(h.substring(4, 6), 16) || 0;
    const a = (opacityPercent ?? 100) / 100;
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  function buildWikiSyntax(){
    // background-image 목록은 "앞쪽(첫 항목)이 위로" 그려지므로 z가 높은(앞) 도형부터 나열
    const frontToBack = [...shapes].sort((a, b) => b.z - a.z);

    const images = [];
    const positions = [];
    const sizes = [];
    const repeats = [];
    let complexCount = 0;

    frontToBack.forEach(s => {
      const needsImage = !!s.rotation || s.type === 'text' || (s.type === 'rect' && s.radius > 0);

      if(needsImage){
        complexCount++;
        const canvas = shapeToCanvas(s); // rotation 0이어도 그대로 동작(둥근모서리/텍스트 굽기용)
        const dataUrl = canvas.toDataURL('image/png');
        const box = s.rotation ? rotatedBBox(s) : { bbX: s.x, bbY: s.y, bbW: s.w, bbH: s.h };
        images.push(`url(${dataUrl})`);
        positions.push(`${box.bbX}px ${box.bbY}px`);
        sizes.push(`${box.bbW}px ${box.bbH}px`);
      } else if(s.type === 'ellipse'){
        const color = hexToRgba(s.fill, s.opacity);
        images.push(`radial-gradient(ellipse at center, ${color} 0%, ${color} 100%)`);
        positions.push(`${s.x}px ${s.y}px`);
        sizes.push(`${s.w}px ${s.h}px`);
      } else {
        // 회전 없고 모서리도 각진 사각형
        const color = hexToRgba(s.fill, s.opacity);
        images.push(`linear-gradient(${color}, ${color})`);
        positions.push(`${s.x}px ${s.y}px`);
        sizes.push(`${s.w}px ${s.h}px`);
      }
      repeats.push('no-repeat');
    });

    const styleParts = [
      `width: ${canvasSize.w}px`,
      `height: ${canvasSize.h}px`,
      `background-color: ${canvasSize.bg}`
    ];
    if(images.length){
      styleParts.push(`background-image: ${images.join(', ')}`);
      styleParts.push(`background-position: ${positions.join(', ')}`);
      styleParts.push(`background-size: ${sizes.join(', ')}`);
      styleParts.push(`background-repeat: ${repeats.join(', ')}`);
    }

    const code = `{{{#!wiki style="${styleParts.join('; ')};"\n}}}`;
    return { code, complexCount, totalCount: frontToBack.length };
  }

  const exportModal = document.getElementById('exportModal');
  const exportCode = document.getElementById('exportCode');
  const exportNote = document.getElementById('exportNote');

  document.getElementById('exportBtn').addEventListener('click', () => {
    const { code, complexCount, totalCount } = buildWikiSyntax();
    exportCode.value = code;
    if(complexCount > 0){
      exportNote.innerHTML = `도형 <b>${totalCount}개</b> 중 회전·둥근모서리·텍스트가 들어간 <b>${complexCount}개</b>는 이미지로 구워서 코드 안에 그대로 인코딩했어요(별도 업로드 불필요, base64라 코드가 좀 길어요).<br><br>⚠️ 나무위키가 <code>position: absolute</code>는 걸러내는 걸 확인했어요. 이번 방식(background-image 겹치기)은 실제 나무위키 문서에서 쓰이는 걸 확인한 기법이지만, <code>background-image: url(data:...)</code>는 아직 확인 못 했어요 — 붙여넣었을 때 이미지 부분(회전/텍스트)이 안 보이면 꼭 알려주세요.`;
    } else {
      exportNote.innerHTML = '아래 코드를 전체 복사해서 나무위키 편집창의 테이블 셀 안에 붙여넣으면 지금 배치한 도형이 그대로 나와요. (position 대신 background-image 겹치기 방식이라 좌표가 안 밀려요.)';
    }
    exportModal.classList.add('open');
  });
  document.getElementById('closeModalBtn').addEventListener('click', () => {
    exportModal.classList.remove('open');
  });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(exportCode.value);
    }catch(e){
      exportCode.select();
      document.execCommand('copy');
    }
    showToast();
  });
  exportModal.addEventListener('mousedown', (e) => {
    if(e.target === exportModal) exportModal.classList.remove('open');
  });

  function showToast(){
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  // seed with one example shape
  addShape('rect');
  const first = shapes[0];
  first.x = 40; first.y = 40; first.w = 160; first.h = 100; first.fill = '#4ADE9A'; first.radius = 16;
  addShape('text');
  const second = shapes[1];
  second.text = '나무위키'; second.x = 60; second.y = 70; second.w = 120; second.h = 40; second.fontSize = 22; second.color = '#0B1410';

  render();
})();
</script>
</body>
</html>
